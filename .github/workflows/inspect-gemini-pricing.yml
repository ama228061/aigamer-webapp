name: Inspect Gemini free-tier availability

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-gemini-pricing.yml]

permissions:
  contents: read

jobs:
  pricing:
    runs-on: ubuntu-latest
    steps:
      - name: Read Google's current public pricing without generation
        run: |
          python3 - <<'PY'
          import urllib.request, html, re
          url = 'https://ai.google.dev/gemini-api/docs/pricing?hl=en'
          try:
              page = urllib.request.urlopen(url, timeout=30).read().decode()
          except Exception:
              print('::error::Official Gemini pricing could not be retrieved. No generation requests were made.')
              raise SystemExit(1)
          headings = list(re.finditer(r'<h[23]\b[^>]*>.*?</h[23]>', page, re.S))
          model_headings = []
          for heading in headings:
              title = re.sub(r'\s+', ' ', html.unescape(re.sub('<[^>]+>', ' ', heading.group())))
              if re.search(r'Gemini\s+\d', title, re.I):
                  model_headings.append((heading, title))
          found = False
          for i, (heading, title) in enumerate(model_headings):
              if not re.search(r'Gemini\s+3(?:\.|\s)', title, re.I):
                  continue
              end = model_headings[i+1][0].start() if i+1 < len(model_headings) else len(page)
              section = page[heading.start():end]
              section = re.sub(r'<(script|style)\b.*?</\1>', '', section, flags=re.S)
              plain = re.sub(r'\s+', ' ', html.unescape(re.sub('<[^>]+>', ' ', section))).strip()
              if not re.search(r'Free (?:Tier|of charge)', plain, re.I):
                  continue
              safe = plain[:6000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::notice title=Official Gemini pricing::' + safe)
              found = True
          if not found:
              titles = [re.sub(r'\s+', ' ', html.unescape(re.sub('<[^>]+>', ' ', heading.group()))).strip() for heading in headings]
              print('::notice title=Public pricing headings::' + ' | '.join(titles)[:5000])
              print('::error::No Gemini 3 free-tier pricing section was identified in the official page. No generation requests were made.')
              raise SystemExit(1)
          print('::notice::Pricing inspection completed without using the Gemini key or generating text.')
          PY
      - name: Read public key authentication and free-tier requirements
        run: |
          python3 - <<'PY'
          import urllib.request, re, html
          urls = [
              'https://ai.google.dev/gemini-api/docs/api-key?hl=en',
              'https://docs.cloud.google.com/api-keys/docs/create-manage-api-keys?hl=en',
          ]
          for url in urls:
              try:
                  page = urllib.request.urlopen(url, timeout=30).read().decode()
              except Exception:
                  print('::warning::Public authentication documentation could not be retrieved from ' + url)
                  continue
              page = re.sub(r'<(script|style)\b.*?</\1>', '', page, flags=re.S)
              plain = re.sub(r'\s+', ' ', html.unescape(re.sub('<[^>]+>', ' ', page)))
              excerpts = []
              for pattern in [r'authenticated key', r'service account', r'bound API key', r'generativelanguage\.[a-z]+', r'Gemini API User', r'free tier', r'billing']:
                  match = re.search(pattern, plain, re.I)
                  if match:
                      excerpt = plain[max(0, match.start()-300):match.end()+1600]
                      if excerpt not in excerpts:
                          excerpts.append(excerpt)
              if not excerpts:
                  print('::notice::Public key documentation was retrieved but contained no recognized authentication/free-tier section: ' + url)
              for excerpt in excerpts:
                  safe = excerpt.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::notice title=Official API key requirements::' + safe)
          PY
