name: Connect Gemini 3 Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/connect-gemini.yml
      - worker.mjs
      - chat.mjs
      - wrangler.jsonc
      - package.json
      - package-lock.json
      - scripts/connect-pages.mjs
      - scripts/deploy-worker.mjs
      - scripts/check-gemini.mjs

permissions:
  contents: write
  pages: write

concurrency:
  group: connect-gemini-worker
  cancel-in-progress: false

jobs:
  connect:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Check required credentials
        # Every new run reads the current values from repository Actions secrets.
        # Standard Gemini keys must be explicitly restricted to Gemini API.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node --input-type=module -e '
            const missing = ["CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID", "GEMINI_API_KEY"].filter(name => !process.env[name]);
            if (missing.length) {
              console.error("::error::Add these repository Actions secrets: " + missing.join(", "));
              process.exit(1);
            }
            if (!/^[a-f0-9]{32}$/i.test(process.env.CLOUDFLARE_ACCOUNT_ID)) {
              console.error("::error::CLOUDFLARE_ACCOUNT_ID must be the 32-character account ID from the Cloudflare dashboard URL.");
              process.exit(1);
            }
          '
      - name: Verify Cloudflare token and account access
        # Publishing also requires Workers Scripts Edit; successful reads alone do not prove it.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module -e '
            const checks = [
              ["/user/tokens/verify", "Cloudflare token authentication"],
              ["/accounts/" + process.env.CLOUDFLARE_ACCOUNT_ID + "/workers/scripts", "Workers access in the selected Cloudflare account"],
            ];
            for (const [path, label] of checks) {
              try {
                const response = await fetch("https://api.cloudflare.com/client/v4" + path, {
                  headers: { Authorization: "Bearer " + process.env.CLOUDFLARE_API_TOKEN },
                  signal: AbortSignal.timeout(30000),
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok || data.success !== true) {
                  const codes = (Array.isArray(data.errors) ? data.errors : []).map(error => error.code).filter(Number.isSafeInteger);
                  console.error("::error::" + label + " failed (HTTP " + response.status + ", error codes " + codes.join(", ") + "). Check the token value, Workers Scripts Edit permission, and account scope.");
                  process.exit(1);
                }
                console.info("::notice::" + label + " verified.");
                if (path === "/user/tokens/verify" && /^[a-f0-9]{32}$/i.test(data.result?.id || "")) {
                  try {
                    const detailsResponse = await fetch("https://api.cloudflare.com/client/v4/user/tokens/" + data.result.id, {
                      headers: { Authorization: "Bearer " + process.env.CLOUDFLARE_API_TOKEN },
                      signal: AbortSignal.timeout(10000),
                    });
                    const details = await detailsResponse.json().catch(() => ({}));
                    if (detailsResponse.ok && details.success === true && Array.isArray(details.result?.policies)) {
                      const policies = details.result.policies;
                      const names = [...new Set(policies.flatMap(policy => Array.isArray(policy.permission_groups) ? policy.permission_groups.map(group => group.name) : []))].filter(name => typeof name === "string" && /^[a-zA-Z0-9 /:()._-]{1,100}$/.test(name));
                      console.info("::notice::Cloudflare token permission groups: " + (names.join(", ") || "not returned"));
                      const writePolicies = policies.filter(policy => policy.effect === "allow" && policy.permission_groups?.some(group => /workers scripts.*(write|edit)/i.test(group.name || "")));
                      if (writePolicies.length) {
                        const resource = "com.cloudflare.api.account." + process.env.CLOUDFLARE_ACCOUNT_ID;
                        const matched = writePolicies.some(policy => Object.keys(policy.resources || {}).some(key => key === resource || key === "com.cloudflare.api.account.*" || key === "*"));
                        console.info("::notice::Workers write policy includes the target account: " + matched);
                      }
                    } else {
                      console.info("::notice::Token policy inspection is unavailable through this API (HTTP " + detailsResponse.status + "); check Permissions in the Cloudflare dashboard.");
                    }
                  } catch {
                    console.info("::notice::Token policy inspection could not be completed; check Permissions in the Cloudflare dashboard.");
                  }
                }
                if (path.endsWith("/workers/scripts") && Array.isArray(data.result)) {
                  console.info("::notice::Target Worker already exists: " + data.result.some(worker => worker.id === "agro-assistant"));
                }
              } catch {
                console.error("::error::" + label + " could not be checked because the Cloudflare API request failed.");
                process.exit(1);
              }
            }
          '
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Verify Gemini key and model access without generation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/check-gemini.mjs
      - name: Deploy Worker
        id: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-worker.mjs
      - name: Store Gemini key securely in the deployed Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node --input-type=module -e '
            try {
              const response = await fetch("https://api.cloudflare.com/client/v4/accounts/" + process.env.CLOUDFLARE_ACCOUNT_ID + "/workers/scripts/agro-assistant/secrets", {
                method: "PUT",
                headers: {
                  Authorization: "Bearer " + process.env.CLOUDFLARE_API_TOKEN,
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({ name: "GEMINI_API_KEY", text: process.env.GEMINI_API_KEY, type: "secret_text" }),
                signal: AbortSignal.timeout(30000),
              });
              const data = await response.json().catch(() => ({}));
              if (!response.ok || data.success !== true) {
                const codes = (Array.isArray(data.errors) ? data.errors : []).map(error => error.code).filter(Number.isSafeInteger);
                console.error("::error::Cloudflare secret upload failed (HTTP " + response.status + ", error codes " + codes.join(", ") + "). The token needs Workers Scripts Edit permission for this account.");
                process.exit(1);
              }
              console.info("::notice::Gemini key stored securely in the deployed Worker.");
            } catch {
              console.error("::error::Cloudflare secret upload failed because the API request could not be completed.");
              process.exit(1);
            }
          '
      - name: Activate the public workers.dev route after the secret update
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module -e '
            try {
              const response = await fetch("https://api.cloudflare.com/client/v4/accounts/" + process.env.CLOUDFLARE_ACCOUNT_ID + "/workers/scripts/agro-assistant/subdomain", {
                method: "POST",
                headers: { Authorization: "Bearer " + process.env.CLOUDFLARE_API_TOKEN, "Content-Type": "application/json" },
                body: JSON.stringify({ enabled: true }),
                signal: AbortSignal.timeout(30000),
              });
              const data = await response.json().catch(() => ({}));
              if (!response.ok || data.success !== true) {
                const codes = (Array.isArray(data.errors) ? data.errors : []).map(error => error.code).filter(Number.isSafeInteger);
                console.error("::error::Cloudflare workers.dev activation failed (HTTP " + response.status + ", error codes " + codes.join(", ") + ").");
                process.exit(1);
              }
              console.info("::notice::Public workers.dev route activated after the Gemini key update.");
            } catch {
              console.error("::error::Cloudflare workers.dev activation request failed.");
              process.exit(1);
            }
          '
      - name: Verify a real answer and connect the public endpoint
        id: chat
        env:
          WORKER_URL: ${{ steps.worker.outputs.deployment-url }}
        run: node scripts/connect-pages.mjs
      - name: Diagnose provider generation access after a Worker failure
        if: failure() && steps.chat.conclusion == 'failure'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/check-gemini.mjs --generation
      - name: Save endpoint to main
        run: |
          git add config.js
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Connect verified Gemini Worker endpoint"
            git push origin HEAD:main
          fi
      # GITHUB_TOKEN commits do not automatically trigger a branch Pages build.
      - name: Request the GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" > /dev/null
      - name: Verify the published GitHub Pages configuration
        run: |
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const expected = (await readFile("config.js", "utf8")).trim();
            const address = "https://ama228061.github.io/aigamer-webapp/config.js";
            const deadline = Date.now() + 180000;
            while (Date.now() < deadline) {
              try {
                const response = await fetch(address + "?deployment=" + process.env.GITHUB_RUN_ID, {
                  cache: "no-store",
                  signal: AbortSignal.timeout(10000),
                });
                if (response.ok && (await response.text()).trim() === expected) {
                  console.info("::notice::Published GitHub Pages configuration matches the verified Gemini Worker endpoint.");
                  process.exit(0);
                }
              } catch {}
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            console.error("::error::GitHub Pages did not publish the verified configuration within three minutes. Check the Pages build status before retrying.");
            process.exit(1);
          '
