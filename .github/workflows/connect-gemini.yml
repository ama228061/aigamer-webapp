name: Connect Gemini 3 Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/connect-gemini.yml
      - worker.mjs
      - chat.mjs
      - wrangler.jsonc
      - package.json
      - package-lock.json
      - scripts/connect-pages.mjs

permissions:
  contents: write
  pages: write

concurrency:
  group: connect-gemini-worker
  cancel-in-progress: false

jobs:
  connect:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Check required credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node --input-type=module -e '
            const missing = ["CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID", "GEMINI_API_KEY"].filter(name => !process.env[name]);
            if (missing.length) {
              console.error("Add these repository Actions secrets: " + missing.join(", "));
              process.exit(1);
            }
          '
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Deploy Worker and store Gemini key securely
        id: worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.148.0"
          secrets: |
            GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Verify a real answer and connect the public endpoint
        env:
          WORKER_URL: ${{ steps.worker.outputs.deployment-url }}
        run: node scripts/connect-pages.mjs
      - name: Save endpoint to main
        run: |
          git add config.js
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Connect verified Gemini Worker endpoint"
            git push origin HEAD:main
          fi
      # GITHUB_TOKEN commits do not automatically trigger a branch Pages build.
      - name: Request the GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" > /dev/null
